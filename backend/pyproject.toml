[project]
name = "veridata-backend"
version = "0.1.0"
description = "Veridata backend — AI data analyst that verifies its own answers."
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-dotenv",
    "python-multipart",
    "duckdb",
    "anthropic",
    "sentry-sdk",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp-proto-http",
    "opentelemetry-instrumentation-fastapi",
]

[project.optional-dependencies]
dev = ["pytest", "httpx", "ruff", "black"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# pyflakes (real bugs), pycodestyle errors, import sorting. Formatting is black's job;
# opinionated families (bugbear/simplify) are left out to avoid FastAPI false positives.
select = ["E", "F", "I"]

[tool.black]
line-length = 100
